name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, documents, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:patches
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:documents
      - run: npm run check:brand
      - run: npm run check:reference
      - run: npm run check:sheet
      - run: npm run check:features
      - run: npm run check:story
      - run: npm run check:pictures
      - run: npm test
