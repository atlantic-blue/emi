name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, documents, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:documents
      - run: npm run check:brand
      - run: npm run check:reference
      - run: npm run check:sheet
      # Ahead of npm test, which runs it again at the end. Two seconds buys a line of its own in
      # the log and a failure that lands before the long tiers do.
      - run: npm run test:hermes
      - run: npm test
