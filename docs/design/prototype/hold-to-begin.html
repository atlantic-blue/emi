ing": "-0.015em", "fontWeight": "400" }] } } } };</script><style>

  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-margin">
<div class="flex flex-col items-center justify-between min-h-[724px] py-space-md select-none">
<!-- Top Header & Brand Statement -->
<header class="flex flex-col items-center text-center space-y-space-xs mt-space-sm">
<span class="font-data-sm text-data-sm uppercase tracking-widest text-primary font-medium">emi · private enclave</span>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight max-w-[280px]">
        Your cycle, your data, your key.
      </h1>
</header>
<!-- Center Interactive Ring Ritual -->
<div class="relative flex flex-col items-center justify-center my-space-lg w-full max-w-[320px]">
<!-- Subtle Ambient Diffuse Aura -->
<div class="absolute w-64 h-64 rounded-full bg-primary-fixed/30 filter blur-2xl transition-all duration-700 opacity-40 pointer-events-none transform scale-90" id="glow-aura"></div>
<!-- SVG Four-Phase Abstract Ribbon Ring -->
<div class="relative w-72 h-72 flex items-center justify-center">
<svg class="w-full h-full -rotate-90 transform" fill="none" viewbox="0 0 240 240">
<!-- Track Underlay -->
<circle class="opacity-40" cx="120" cy="120" r="102" stroke="#FFF8F5" stroke-width="6"></circle>
<!-- Phase 1: Menstrual (#D97D6E) [0% to 22%] -->
<circle class="transition-opacity duration-300" cx="120" cy="120" opacity="0.85" r="102" stroke="#D97D6E" stroke-dasharray="141 500" stroke-dashoffset="0" stroke-linecap="round" stroke-width="4.5"></circle>
<!-- Phase 2: Follicular (#E5A96D) [25% to 48%] -->
<circle class="transition-opacity duration-300" cx="120" cy="120" opacity="0.85" r="102" stroke="#E5A96D" stroke-dasharray="147 500" stroke-dashoffset="-160" stroke-linecap="round" stroke-width="4.5"></circle>
<!-- Phase 3: Ovulation (#A8A663) [51% to 68%] -->
<circle class="transition-opacity duration-300" cx="120" cy="120" opacity="0.85" r="102" stroke="#A8A663" stroke-dasharray="109 500" stroke-dashoffset="-324" stroke-linecap="round" stroke-width="4.5"></circle>
<!-- Phase 4: Luteal (#9B849E) [71% to 97%] -->
<circle class="transition-opacity duration-300" cx="120" cy="120" opacity="0.85" r="102" stroke="#9B849E" stroke-dasharray="166 500" stroke-dashoffset="-450" stroke-linecap="round" stroke-width="4.5"></circle>
<!-- Active Smooth Filling Completion Ribbon Arc -->
<circle class="transition-all ease-linear" cx="120" cy="120" id="progress-circle" r="102" stroke="#A3482C" stroke-dasharray="641" stroke-dashoffset="641" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Tactile Hold Target Core -->
<button aria-label="Hold to seal cryptographic key" class="absolute w-44 h-44 rounded-full bg-surface-container flex flex-col items-center justify-center p-space-md shadow-md transition-transform duration-200 active:scale-95 cursor-pointer touch-none outline-none" id="seal-trigger">
<!-- Symbolic Encrypted Core Glyph -->
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center mb-space-xs text-primary transition-colors duration-300" id="core-icon-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">lock_open</span>
</div>
<span class="font-label-md text-label-md tracking-wider uppercase text-on-surface font-semibold" id="seal-label">Hold to seal</span>
<span class="font-data-sm text-data-sm text-secondary mt-0.5" id="seal-sublabel">2.5s</span>
</button>
</div>
<!-- Explanatory Guide Directly Under Ring -->
<div class="flex flex-col items-center text-center mt-space-md space-y-space-xs px-space-sm">
<p class="font-headline-sm text-headline-sm text-on-surface" id="instruction-title">
          Press and hold the ring to begin.
        </p>
<p class="font-body-sm text-body-sm text-secondary max-w-[260px]" id="instruction-sub">
          Generates your private cryptographic key in local enclave storage.
        </p>
</div>
</div>
<!-- Bottom Status Card -->
<footer class="w-full flex justify-center pb-space-xs">
<div class="inline-flex items-center space-x-2 bg-surface-container-high px-space-md py-space-xs rounded-full">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-data-sm text-data-sm text-on-secondary-fixed-variant">Local Key Generation · 256-bit AES</span>
</div>
</footer>
</div>
</div>
<script>
  (function() {
    const trigger = document.getElementById('seal-trigger');
    const circle = document.getElementById('progress-circle');
    const glow = document.getElementById('glow-aura');
    const label = document.getElementById('seal-label');
    const sublabel = document.getElementById('seal-sublabel');
    const iconContainer = document.getElementById('core-icon-container');
    const instructionTitle = document.getElementById('instruction-title');
    const instructionSub = document.getElementById('instruction-sub');

    const totalLength = 641;
    const holdDuration = 2500;
    let startTime = null;
    let animationFrame = null;
    let completed = false;

    function updateProgress(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = Math.min(elapsed / holdDuration, 1);
      
      const offset = totalLength - (progress * totalLength);
      circle.style.strokeDashoffset = offset;
      
      glow.style.opacity = (0.4 + (progress * 0.5)).toString();
      glow.style.transform = `scale(${0.9 + (progress * 0.35)})`;

      const remainingSecs = Math.max(0, ((holdDuration - elapsed) / 1000)).toFixed(1);
      sublabel.textContent = `${remainingSecs}s`;

      if (progress < 1) {
        animationFrame = requestAnimationFrame(updateProgress);
      } else {
        onSuccess();
      }
    }

    function startHold(e) {
      if (completed) return;
      if (e.cancelable) e.preventDefault();
      startTime = null;
      label.textContent = "Sealing...";
      trigger.classList.add('bg-surface-container-highest');
      glow.classList.remove('opacity-40');
      animationFrame = requestAnimationFrame(updateProgress);
    }

    function cancelHold() {
      if (completed) return;
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      startTime = null;
      circle.style.strokeDashoffset = totalLength;
      glow.style.opacity = "0.4";
      glow.style.transform = "scale(0.9)";
      label.textContent = "Hold to seal";
      sublabel.textContent = "2.5s";
      trigger.classList.remove('bg-surface-container-highest');
    }

    function onSuccess() {
      completed = true;
      cancelAnimationFrame(animationFrame);
      circle.style.strokeDashoffset = 0;
      glow.style.opacity = "0.85";
      glow.style.transform = "scale(1.25)";
      
      trigger.classList.remove('bg-surface-container-highest');
      trigger.classList.add('bg-primary-container');
      
      iconContainer.innerHTML = '<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: \'FILL\' 1;">lock</span>';
      iconContainer.classList.add('bg-surface-container-lowest');
      
      label.textContent = "Sealed";
      label.classList.remove('text-on-surface');
      label.classList.add('text-on-primary-container');
      
      sublabel.textContent = "Hardware Enclave";
      sublabel.classList.remove('text-secondary');
      sublabel.classList.add('text-on-primary-fixed-variant');

      instructionTitle.textContent = "Enclave secured.";
      instructionSub.textContent = "Your private sanctuary is calibrated and ready.";

      if (navigator.vibrate) {
        navigator.vibrate([40, 60, 100]);
      }
    }

    // Touch and mouse events for seamless mobile tap-and-hold
    trigger.addEventListener('touchstart', startHold, { passive: false });
    trigger.addEventListener('touchend', cancelHold);
    trigger.addEventListener('touchcancel', cancelHold);

    trigger.addEventListener('mousedown', startHold);
    window.addEventListener('mouseup', cancelHold);
  })();
</script></main></body></html>
