name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, typecheck, documents, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:patches
      # The bundles are built and then loaded through the runtime interface emulator, which needs
      # the Docker the runner already carries. A pull request proves them and uploads nothing.
      - run: npm run build:functions
      - run: npm run check:bundles
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:documents
      - run: npm run check:brand
      - run: npm run check:reference
      - run: npm run check:sheet
      - run: npm run check:features
      - run: npm run check:story
      - run: npm run check:pictures
      - run: npm run check:mockups
      - run: npm test

  browser:
    name: a browser opens the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No system packages. The runner image already holds the libraries Chromium needs, and
      # a package install reads the Ubuntu mirror, which the runner cannot always resolve.
      - run: npx playwright install chromium
      # Builds the site, starts it, and reads it with a browser at both widths. The last command
      # of the script refuses a run that carried out no scenario, because a browser suite with
      # nothing to do reports a pass that reads the same as every other pass.
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what-the-browser-saw
          path: |
            apps/website/e2e/report/
            apps/website/test-results/
          if-no-files-found: ignore
          retention-days: 7
